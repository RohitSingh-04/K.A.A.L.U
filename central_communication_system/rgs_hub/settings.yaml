llm:
  default_provider: "gemini"  # Options: ollama, openai, anthropic, gemini
  default_model: "gemini-3.1-flash-lite"     # Model name (e.g., gemini-3.1-flash-lite, gemini-flash-lite-latest, gemini-3.8-flash, qwen2.5)
  providers:
    ollama:
      base_url: "http://localhost:11434"
    openai:
      api_env_var: "OPENAI_API_KEY"
    anthropic:
      api_env_var: "ANTHROPIC_API_KEY"
    gemini:
      api_env_var: "GEMINI_API_KEY"
