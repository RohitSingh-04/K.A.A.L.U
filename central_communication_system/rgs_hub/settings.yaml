llm:
  default_provider: "ollama"  # Options: ollama, openai, anthropic, gemini
  default_model: "qwen2.5"     # Model name (e.g., qwen2.5, gpt-4o, claude-3-5-sonnet, gemini-1.5-pro)
  providers:
    ollama:
      base_url: "http://localhost:11434"
    openai:
      api_env_var: "OPENAI_API_KEY"
    anthropic:
      api_env_var: "ANTHROPIC_API_KEY"
    gemini:
      api_env_var: "GEMINI_API_KEY"