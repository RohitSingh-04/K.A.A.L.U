<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>David Browser Agent</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; width: 220px; padding: 14px; margin: 0; text-align: center; }
        h3 { color: #2c3e50; margin: 0 0 10px 0; font-size: 16px; }
        p { font-size: 13px; color: #555; margin: 6px 0; }
        .status { font-weight: bold; }
        .connected { color: #27ae60; }
        .disconnected { color: #e74c3c; }
        button {
            margin-top: 10px;
            padding: 6px 14px;
            background-color: #2980b9;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        button:hover { background-color: #1f618d; }
    </style>
</head>
<body>
    <h3>David Browser Agent</h3>
    <p>Status: <span id="status" class="status disconnected">Checking...</span></p>
    <button id="reconnectBtn">Reconnect</button>
    <script src="popup.js"></script>
</body>
</html>
